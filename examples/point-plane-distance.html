:root{--paper:#f5f4ed;--ink:#282722;--blue:#1b365d;--muted:#625d52;--rule:#d5cfc0;--diagram:#fbfaf5;--faded:#81796b;--button-bg:#1b365d;--button-ink:#fff;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Songti SC","Noto Serif CJK SC",serif}
main{max-width:820px;margin:auto;padding:clamp(18px,5vw,48px)}
header{border-top:2px solid var(--blue);padding-top:16px}

#next{background:var(--button-bg);color:var(--button-ink)}button:disabled{opacity:.42;cursor:default}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#count{margin-right:auto;font-size:14px}

svg line,svg path,svg circle{stroke:currentColor;vector-effect:non-scaling-stroke}svg line,svg path{fill:none;stroke-width:1.25}svg circle{fill:currentColor}svg text{fill:currentColor;font-size:19px}svg .plane{font-size:17px;fill:var(--muted)}svg .aux{stroke-dasharray:4 4}svg .old{color:var(--faded)}svg .new,svg .answer{color:var(--blue)}svg .new line,svg .new path{stroke-width:1.65}svg .old .temporary{display:none}svg .found{font-weight:bold}

a{color:var(--blue)}.catalog{list-style:none;padding:0}.catalog li{padding:14px 0;border-bottom:1px solid var(--rule)}
svg .center{stroke-dasharray:10 4 2 4}svg .axis{stroke-width:1}svg .answer line{stroke-width:1.6}
svg .dim{font-size:15px}svg .hidden-edge{stroke-dasharray:6 4}svg text{stroke:none}

svg .ring{fill:none}svg .ring,svg .ring.aux{stroke-width:1.25}
@media(prefers-color-scheme:dark){:root{--paper:#242218;--ink:#ebe5d7;--blue:#abc9eb;--muted:#beb6a5;--rule:#5b5547;--diagram:#211f15;--faded:#a19a8b;--button-bg:#223d5f;--button-ink:#fff}}
.space-controls { display:flex; flex-wrap:wrap; gap:8px; }
.space-panel svg { margin-top:8px; background:var(--diagram); border:1px solid var(--rule); }
.space-panel svg text { font-size:22px; }
.space-panel svg .space-result { color:var(--blue); }
.space-panel svg .space-result line { stroke-width:2; }
.space-panel svg .space-axis { color:var(--ink); }
.space-point { cursor:pointer; }
.space-point .point-hit { fill:transparent; stroke:none; }
.space-point:focus-visible .point-hit,
.space-point.is-selected .point-hit { stroke:var(--blue); stroke-width:2; }
svg [data-point].is-selected { color:var(--blue); }
svg text.is-selected { font-weight:bold; text-decoration:underline; }
#drawing circle.is-selected { r:5; stroke-width:2; }
.space-note, .space-status { color:var(--muted); font-size:.9rem; margin:8px 0; }
main:has(.diagram-pair) { max-width:1240px; display:flex; flex-direction:column; }
main:has(.diagram-pair) > header { order:-2; }
main:has(.diagram-pair) > .controls { order:-1; position:sticky; top:0; z-index:1; background:var(--paper); }
.diagram-pair { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:clamp(20px,3vw,36px); margin:20px 0; align-items:start; }
.diagram-pair h2 { margin:0 0 8px; }
.paper-panel figure { margin:0; }
.space-panel { margin:0; }
.space-panel svg .plane { font-size:15px; }
.space-panel .space-projection { color:var(--blue); }
.space-panel .space-projection text { fill:var(--blue); }
@media(max-width:820px) { .diagram-pair { grid-template-columns:1fr; gap:18px; } }

.space-panel svg[data-orbit] { touch-action:none; cursor:grab; user-select:none; }
.space-panel svg[data-orbit]:active { cursor:grabbing; }

.space-plane { color:var(--faded); }
.space-plane polygon { fill:currentColor; fill-opacity:.05; stroke:currentColor; stroke-opacity:.48; vector-effect:non-scaling-stroke; }
.space-plane.is-active,.space-plane.plane-extra { color:var(--blue); }
.space-plane.is-active polygon { fill-opacity:.12; stroke-opacity:.82; }
.space-plane.is-active text { fill:currentColor; font-weight:bold; }
[data-space-focus].is-faded { opacity:.36; }
.space-status:empty { display:none; }

2="507.81" y2="198.56" class=""/><text x="526.3" y="211.99" class="dim">20 mm</text><line x1="466.59" y1="182.97" x2="500.69" y2="208.19" class="aux"/><line x1="495.87" y1="204.62" x2="499.44" y2="199.8" class=""/><line x1="499.44" y1="199.8" x2="504.26" y2="203.36" class=""/><text x="488.64" y="191.58" class="dim">20 mm</text></g><g data-layer="original-projections" class="is-hidden"><line x1="208.61" y1="83.7442" x2="208.61" y2="278.3804" class="aux"/><circle cx="208.61" cy="83.7442" r="2.7" data-point="D1"/><text x="213.61" y="77.74" class="" data-point="D1">d1′</text><circle cx="208.61" cy="278.3804" r="2.7" data-point="D1"/><text x="213.61" y="292.38" class="" data-point="D1">d1</text><line x1="151.56" y1="35.7021" x2="151.56" y2="227.9362" class="aux"/><circle cx="151.56" cy="35.7021" r="2.7" data-point="D2"/><text x="156.56" y="29.7" class="" data-point="D2">d2′</text><circle cx="151.56" cy="227.9362" r="2.7" data-point="D2"/><text x="156.56" y="241.94" class="" data-point="D2">d2</text><line x1="180.2" y1="59.82" x2="151.56" y2="35.7021" class="aux"/><line x1="180.2" y1="253.26" x2="151.56" y2="227.9362" class="aux"/></g><g data-layer="answer-geometry" class="is-hidden"><line x1="378" y1="340" x2="624" y2="340" class=""/><text x="608" y="359" class="">X₁</text><line x1="392.43" y1="354.56" x2="515.36" y2="188.35" class=""/><text x="399" y="336.99" class="">a₁</text><text x="439.56" y="265.16" class="">b₁</text><text x="495.8" y="217.92" class="">c₁</text><line x1="502.62" y1="205.88" x2="595.82" y2="265.16" class=""/><circle cx="502.62" cy="205.88" r="2.7"/><text x="509.62" y="198.88" class="">e₁</text><circle cx="595.82" cy="265.16" r="2.7"/><text x="602.82" y="278.16" class="">f₁</text><line x1="502.62" y1="205.88" x2="466.59" y2="182.97" class="aux"/><circle cx="538.35" cy="228.6" r="2.7"/><text x="545.35" y="223.6" class="">d1₁</text><circle cx="466.59" cy="182.97" r="2.7"/><text x="473.59" y="177.97" class="">d2₁</text></g></svg><figcaption>依据原卷重绘。未标注的图 <section class="explain" aria-live="polite"><h2 id="heading">题图</h2><p id="action">读题</p><p id="why" class="why">在直线 EF 上求点 D，使 D 到三角形 ABC 所在平面的距离为 20 mm。</p></section>

<noscript>启用 JavaScript 后可查看分步作图。</noscript>
<script type="application/json" id="lesson">{"given": ["given"], "intro": {"title": "题图", "action": "读题", "reason": "在直线 EF 上求点 D，使 D 到三角形 ABC 所在平面的距离为 20 mm。"}, "steps": [{"title": "在平面内找水平线", "action": "过 b′ 作水平线，交 a′c′ 得 p′。向下投影到 ac 得 p，连接 bp。", "reason": "BP 平行于 H 面。它的水平投影 bp 给出了该水平线的实方向。", "add": ["horizontal-line"]}, {"title": "换面，让 ABC 积聚成直线", "action": "在 H 图空白处作 X₁ 垂直于 bp。沿垂直于 X₁ 的投影方向转移各点，距 X₁ 的高度沿用正面投影中的高度。右侧单独绘出辅助视图。", "reason": "BP 垂直于新投影面，所以 b₁ 与 p₁ 重合，整个 ABC 积聚为 a₁b₁c₁。EF 的新投影为 e₁f₁。", "add": ["edge-view"]}, {"title": "在线的两侧各偏移 20 mm", "action": "在辅助视图中，作两条与 a₁b₁c₁ 平行、垂距均为 20 mm 的线。分别与 e₁f₁ 或其延长线相交。", "reason": "ABC 在该视图里积聚成直线，垂直于 ABC 的距离在此视图中显示实长。两侧都要检查。", "add": ["offset-intersections"], "show": ["offset-intersections-marks"]}, {"title": "回到原来的两面投影", "action": "从两个交点分别反投影到原来的 ef 直线，再在 e′f′ 直线上找对应点。必要时延长 EF 的投影。", "reason": "也可用辅助视图中交点距 X₁ 的有向高度，在正面图作同一高度的水平线，再向下对正。", "show": ["original-projections"]}], "answer": {"title": "完成图", "action": "共有两个候选点。按重绘图，一个在 EF 线段上，另一个在越过 E 的延长线上。", "show": ["original-projections", "answer-geometry"]}}</script>
<script>
const config = JSON.parse(document.getElementById('lesson').textContent);
const get = id => document.getElementById(id);
const layers = new Map(Array.from(get('drawing').children, group => [group.dataset.layer, group]));
const previous = get('prev'), next = get('next'), finish = get('finish');
let current = 0;

function render(position) {
  current = position;
  const last = config.steps.length + 1;
  const done = position === last;
  const step = done ? config.answer : position ? config.steps[position - 1] : config.intro;
  const given = new Set(config.given);
  const earlier = new Set(done ? [] : config.steps.slice(0, Math.max(0, position - 1)).flatMap(item => item.add || []));
  const highlight = new Set(done ? step.show : [...(step.add || []), ...(step.show || [])]);

  for (const [id, group] of layers) {
    const state = highlight.has(id) ? (done ? 'answer' : 'new') :
      given.has(id) ? '' : earlier.has(id) ? 'old' : 'is-hidden';
    group.setAttribute('class', state);
  }

  get('heading').textContent = step.title;
  get('action').textContent = step.action;
  get('why').textContent = step.reason || '';
  get('count').textContent = done ? '完成图' : position ? '第 ' + position + ' 步 / 共 ' + config.steps.length + ' 步' : '题图';
  previous.disabled = position === 0;
  next.disabled = finish.disabled = done;
  renderSpace(position);
}

previous.onclick = () => render(current - 1);
next.onclick = () => render(current + 1);
finish.onclick = () => render(config.steps.length + 1);
const panel = get('space-panel');
const pointMarkers = [...panel.querySelectorAll('.space-point')];
const linkedPoints = [...get('drawing').querySelectorAll('[data-point]'), ...pointMarkers];
const sceneSteps = [...panel.querySelectorAll('[data-space-step]')];
const planes = [...panel.querySelectorAll('[data-plane]')];
const reference = panel.querySelector('.space-status');
let selectedPoint = '';

function highlightPoint() {
  for (const node of linkedPoints) {
    const active = selectedPoint === node.dataset.point;
    node.classList.toggle('is-selected', active);
    if (node.matches('.space-point')) node.setAttribute('aria-pressed', String(active));
  }

  const projections = [...new Set(linkedPoints
    .filter(node => node.tagName.toLowerCase() === 'text' && node.dataset.point === selectedPoint &&
      !node.closest('.is-hidden'))
    .map(node => node.textContent))];
  reference.textContent = selectedPoint
    ? selectedPoint + ' 的投影 · ' + (projections.join('、') || '本步还未画出')
    : '点选字母，对照纸面图中已画出的投影。';
}

function renderSpace(position) {
  const activePlanes = new Set();
  for (const element of sceneSteps) {
    const start = Number(element.dataset.spaceStep);
    const end = Number(element.dataset.spaceUntil ?? Infinity);
    const visible = position >= start && position <= end;
    element.classList.toggle('is-hidden', !visible);
    element.classList.toggle('is-faded', visible && Boolean(element.dataset.spaceFocus) && position > start && end !== Infinity);
    if (visible && element.dataset.spaceFocus && (position === start || end === Infinity)) {
      activePlanes.add(element.dataset.spaceFocus);
    }
  }
  for (const plane of planes) {
    plane.classList.toggle('is-active', activePlanes.has(plane.dataset.plane));
  }
  if (!pointMarkers.some(node => node.dataset.point === selectedPoint && !node.closest('.is-hidden'))) {
    selectedPoint = '';
  }
  highlightPoint();
}

for (const marker of pointMarkers) {
  marker.onclick = () => {
    selectedPoint = selectedPoint === marker.dataset.point ? '' : marker.dataset.point;
    highlightPoint();
  };
  marker.onkeydown = event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      marker.onclick();
    }
  };
}

// Orbit the existing SVG geometry, keeping paper projections and point IDs fixed.
const orbit = panel.querySelector('svg[data-orbit]');
const objects = [...orbit.querySelectorAll('[data-world]')].map(element => ({
  element,
  points: element.dataset.world.split(' ').map(point => point.split(',').map(Number)),
  offset: (element.dataset.offset || '0,0').split(',').map(Number),
}));
const fit = orbit.dataset.fit.split(' ').map(point => point.split(',').map(Number));
const defaults = orbit.dataset.orbit.split(',').map(Number);
let [azimuth, elevation] = defaults;
let drag = null;

function drawOrbit() {
  const a = azimuth * Math.PI / 180;
  const e = elevation * Math.PI / 180;
  const sa = Math.sin(a), ca = Math.cos(a), se = Math.sin(e), ce = Math.cos(e);
  const project = ([x, y, z]) => [-sa * x + ca * y, se * (ca * x + sa * y) - ce * z];
  const all = fit.map(project);
  const xs = all.map(([x]) => x), ys = all.map(([,y]) => y);
  const left = Math.min(...xs), right = Math.max(...xs);
  const top = Math.min(...ys), bottom = Math.max(...ys);
  const scale = Math.min(430 / Math.max(1, right - left), 214 / Math.max(1, bottom - top));
  for (const {element, points, offset} of objects) {
    const mapped = points.map(project).map(([x, y]) =>
      [270 + (x - (left + right) / 2) * scale, 142 + (y - (top + bottom) / 2) * scale]);
    const [[x,y]] = mapped;
    const tag = element.localName;
    const attrs = tag === 'polygon' ? {points: mapped.map(p => p.join(',')).join(' ')} :
      tag === 'line' ? {x1:x, y1:y, x2:mapped[1][0], y2:mapped[1][1]} :
      tag === 'circle' ? {cx:x, cy:y} : {
        x:Math.max(10, Math.min(435, x + offset[0])),
        y:Math.max(20, Math.min(272, y + offset[1])),
      };
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  }
}

get('reset-space').addEventListener('click', () => {
  [azimuth, elevation] = defaults;
  drawOrbit();
});

orbit.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  drag = {id:event.pointerId, x:event.clientX, y:event.clientY, azimuth, elevation, moved:false};
});
orbit.addEventListener('pointermove', event => {
  if (!drag || drag.id !== event.pointerId) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 5) return;
    orbit.setPointerCapture(event.pointerId);
    drag.moved = true;
  }
  azimuth = drag.azimuth - dx * .42;
  elevation = Math.max(8, Math.min(83, drag.elevation + dy * .35));
  drawOrbit();
});
function endDrag(event) {
  if (drag?.id === event.pointerId) drag = null;
}
orbit.addEventListener('pointerup', endDrag);
orbit.addEventListener('pointercancel', endDrag);
orbit.addEventListener('pointerleave', event => {
  if (!drag?.moved) endDrag(event);
});
</script>
