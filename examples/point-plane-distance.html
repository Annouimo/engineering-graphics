<script>
const stages=JSON.parse(document.querySelector('#stages').textContent);
const get=id=>document.getElementById(id);
const previous=get('prev'), next=get('next'), finish=get('finish');
let current=0;
function render(position) {
  current=position;
  const [heading, action, why, drawing]=stages[position];
  const last=stages.length-1;
  get('drawing').innerHTML=drawing;
  get('heading').textContent=heading;
  get('action').textContent=action;
  get('why').textContent=why;
  get('count').textContent=position===0 || position===last ? heading : '第 '+position+' 步 / 共 '+(last-1)+' 步';
  previous.disabled=position===0;
  next.disabled=finish.disabled=position===last;
}
previous.onclick=()=>render(current-1);
next.onclick=()=>render(current+1);
finish.onclick=()=>render(stages.length-1);
render(0);
</script></main></html>
