<script type="application/json" id="lesson">{"given": ["given"], "intro": {"title": "题图", "action": "读题", "reason": "以 AB 为底边作等腰三角形 ABC，使腰 AC 同时垂直于 EF 和 GK。已知 AB 为水平线、EF 为正平线。求 ABC 与 H 面的夹角。"}, "steps": [{"title": "把两个方向移到 A", "action": "过 A 作 AP ∥ EF、AQ ∥ GK。两面投影中分别复制各自的方向。", "reason": "要求 AC 同时垂直于两个方向，因此 AC 是 AP、AQ 所定平面的法线。", "add": ["parallel-directions"]}, {"title": "找出平面内的水平线", "action": "过 a′ 作水平线，与 p′q′相交得 r′，再在 pq上定 r。连接 ar。", "reason": "AR 是水平线。AP 已是正平线，二者分别可在水平投影和正面投影中用来定位法线方向。", "add": ["horizontal-line"]}, {"title": "用直角投影定理作 AC 的方向", "action": "过 a 作 ar 的垂线，过 a′ 作 a′p′ 的垂线。这两条线分别给出 AC 的水平与正面投影方向。", "reason": "垂直于平面内两相交直线，即垂直于该平面。水平线和正平线各自在相应投影面上显示实长，直角在该面保持。", "add": ["normal-direction"], "show": ["normal-direction-marks"]}, {"title": "用等腰条件定 C", "action": "在水平图作 ab 的垂直平分线，与刚作出的 ac 方向交于 c。向正面图投影得 c′，再连 BC 两面投影。", "reason": "A、B 等高，C 到 A、B 的高差相同。ca = cb 就能保证 CA = CB。", "add": ["triangle"], "show": ["triangle-marks"]}, {"title": "换面读出 ABC 与 H 面的夹角", "action": "令新轴 X₁ 垂直于 ab，按原高度换面。AB 积聚为 a₁ ≡ b₁，连接 a₁c₁。", "reason": "辅助面垂直于 ABC 和 H 面。a₁c₁ 与平行于 X₁ 的水平线之间的锐角，就是所求倾角。", "show": ["edge-view"]}], "answer": {"title": "完成图", "action": "AC = BC，且 AC 垂直于 EF、GK。按重绘数据，平面倾角约为 31.1°。", "show": ["triangle", "answer-geometry"]}}</script>
<script>
const config = JSON.parse(document.getElementById('lesson').textContent);
const get = id => document.getElementById(id);
const layers = new Map(Array.from(get('drawing').children, group => [group.dataset.layer, group]));
const previous = get('prev'), next = get('next'), finish = get('finish');
let current = 0;

function render(position) {
  current = position;
  const last = config.steps.length + 1;
  const done = position === last;
  const step = done ? config.answer : position ? config.steps[position - 1] : config.intro;
  const given = new Set(config.given);
  const earlier = new Set(done ? [] : config.steps.slice(0, Math.max(0, position - 1)).flatMap(item => item.add || []));
  const highlight = new Set(done ? step.show : [...(step.add || []), ...(step.show || [])]);

  for (const [id, group] of layers) {
    const state = highlight.has(id) ? (done ? 'answer' : 'new') :
      given.has(id) ? '' : earlier.has(id) ? 'old' : 'is-hidden';
    group.setAttribute('class', state);
  }

  get('heading').textContent = step.title;
  get('action').textContent = step.action;
  get('why').textContent = step.reason || '';
  get('count').textContent = done ? '完成图' : position ? '第 ' + position + ' 步 / 共 ' + config.steps.length + ' 步' : '题图';
  previous.disabled = position === 0;
  next.disabled = finish.disabled = done;
}

previous.onclick = () => render(current - 1);
next.onclick = () => render(current + 1);
finish.onclick = () => render(config.steps.length + 1);
</script>
