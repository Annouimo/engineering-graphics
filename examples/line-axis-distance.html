<style>

.explain{padding-top:14px;min-height:145px}h2{margin:0 0 5px;color:var(--blue);font-size:21px}
.why{color:var(--muted)}details{border-top:1px solid var(--rule);padding-top:12px}summary{cursor:pointer;color:var(--blue)}

a{color:var(--blue)}.catalog{list-style:none;padding:0}.catalog li{padding:14px 0;border-bottom:1px solid var(--rule)}

.is-hidden{display:none}
svg .ring{fill:none}svg .ring,svg .ring.aux{stroke-width:1.25}
@media(prefers-color-scheme:dark){:root{--paper:#242218;--ink:#ebe5d7;--blue:#abc9eb;--muted:#beb6a5;--rule:#5b5547;--diagram:#211f15;--faded:#a19a8b;--button-bg:#223d5f;--button-ink:#fff}}

=""/><text x="356.28" y="165.67" class="dim">MN 实长</text></g><g data-layer="transfer-foot" class="is-hidden"><line x1="397.78" y1="123.68" x2="217.78" y2="123.68" class="aux"/><line x1="217.78" y1="123.68" x2="217.78" y2="326.78" class="aux"/><circle cx="217.78" cy="123.68" r="2.7"/><text x="192.78" y="126.68" class="">m′</text><circle cx="217.78" cy="326.78" r="2.7"/><text x="199.78" y="341.78" class="">m</text></g><g data-layer="axis-intersection" class="is-hidden"><line x1="217.78" y1="123.68" x2="217.78" y2="232" class=""/><line x1="217.78" y1="326.78" x2="217.78" y2="232" class=""/><circle cx="217.78" cy="232" r="2.7"/><text x="190.78" y="224" class="">n ≡ n′</text></g><g data-layer="answer-geometry" class="is-hidden"><line x1="373" y1="102" x2="453" y2="172" class=""/><circle cx="303" cy="232" r="2.7"/><text x="315" y="224" class="">n″</text><circle cx="217.78" cy="123.68" r="2.7"/><text x="192.78" y="126.68" class="">m′</text><circle cx="217.78" cy="326.78" r="2.7"/><text x="198.78" y="340.78" class="">m</text></g></svg><figcaption>依据原卷重绘。未标注的图面坐标为估读值，图中数值仅供方法核对。</figcaption></figure>

<section class="explain" aria-live="polite"><h2 id="heading">题图</h2><p id="action">读题</p><p id="why" class="why">求 AB 与 X 轴之间公垂线段 MN 的实长，并作出 MN 的三面投影。M 在 AB 上，N 在 X 轴上。</p></section>

<noscript>启用 JavaScript 后可查看分步作图。</noscript>
<script type="application/json" id="lesson">{"given": ["given"], "intro": {"title": "题图", "action": "读题", "reason": "求 AB 与 X 轴之间公垂线段 MN 的实长，并作出 MN 的三面投影。M 在 AB 上，N 在 X 轴上。"}, "steps": [{"title": "把 X 轴看成一个点", "action": "用等高与等深关系补出 a″、b″，连接 a″b″。", "reason": "X 轴垂直于 W 面，在侧面图中积聚为 O，也就是 n″。", "add": ["side-projection"]}, {"title": "作垂足并量实长", "action": "从 O 向 a″b″ 作垂线，垂足为 m″。", "reason": "MN 垂直于 X 轴，所以平行于 W 面。它在侧面图保持实长，并与 a″b″ 垂直。", "add": ["perpendicular-foot"], "show": ["perpendicular-foot-marks"]}, {"title": "找出 m′ 和 m", "action": "从 m″ 向左引等高线与 a′b′ 相交得 m′，再向下投影到 ab，得 m。", "reason": "M 是直线 AB 上的点，同一空间点的正面与水平投影对正。", "add": ["transfer-foot"]}, {"title": "确定 n′ 和 n", "action": "取 m′m 与 X 轴的交点为 n′、n 的重合位置，连 m′n′ 和 mn。", "reason": "MN 垂直于 X 轴，因此 N 与 M 的 X 向坐标相同。", "show": ["axis-intersection"]}], "answer": {"title": "完成图", "action": "m″n″ 为实长。三个视图分别是 m′n′、mn、m″n″。", "show": ["perpendicular-foot", "axis-intersection", "answer-geometry"]}}</script>
<script>
const config = JSON.parse(document.getElementById('lesson').textContent);
const get = id => document.getElementById(id);
const layers = new Map(Array.from(get('drawing').children, group => [group.dataset.layer, group]));
const previous = get('prev'), next = get('next'), finish = get('finish');
let current = 0;

function render(position) {
  current = position;
  const last = config.steps.length + 1;
  const done = position === last;
  const step = done ? config.answer : position ? config.steps[position - 1] : config.intro;
  const given = new Set(config.given);
  const earlier = new Set(done ? [] : config.steps.slice(0, Math.max(0, position - 1)).flatMap(item => item.add || []));
  const highlight = new Set(done ? step.show : [...(step.add || []), ...(step.show || [])]);

  for (const [id, group] of layers) {
    const state = highlight.has(id) ? (done ? 'answer' : 'new') :
      given.has(id) ? '' : earlier.has(id) ? 'old' : 'is-hidden';
    group.setAttribute('class', state);
  }

  get('heading').textContent = step.title;
  get('action').textContent = step.action;
  get('why').textContent = step.reason || '';
  get('count').textContent = done ? '完成图' : position ? '第 ' + position + ' 步 / 共 ' + config.steps.length + ' 步' : '题图';
  previous.disabled = position === 0;
  next.disabled = finish.disabled = done;
}

previous.onclick = () => render(current - 1);
next.onclick = () => render(current + 1);
finish.onclick = () => render(config.steps.length + 1);
</script>
</main>
